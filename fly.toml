app = "roster-system"
primary_region = "jnb"  # Johannesburg - closest to South Africa

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # NEVER sleep
  auto_start_machines = true
  min_machines_running = 1     # Always at least 1 running

[mounts]
  source = "roster_data"
  destination = "/data"        # SQLite file lives here, persisted across deploys
